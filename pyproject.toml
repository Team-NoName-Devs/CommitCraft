[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commitcraft"
version = "0.1.0"
description = "Turn a messy Git working tree into logical, reviewable commits with local AI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Team-NoName-Devs" }
]
keywords = ["git", "commits", "ai", "ollama", "developer-tools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "gitpython>=3.1.40",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "unidiff>=0.7.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
commitcraft = "commitcraft.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/commitcraft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
